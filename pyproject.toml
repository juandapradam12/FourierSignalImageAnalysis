[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-analysis"
version = "1.0.0"
description = "1D and 2D Fourier analysis for signal frequency estimation and image filtering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Juan David Prada Malagon", email = "pradamalagonjd@gmail.com" },
]
keywords = ["fourier", "dft", "fft", "signal-processing", "image-processing"]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
